name: Three-slot failover
on: [push, pull_request]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sh -n install.sh && sh tests/test-three-slot-policy.sh
      - run: sh tests/test-three-slot-probe.sh
      - run: sh tests/test-maintenance-candidate.sh
