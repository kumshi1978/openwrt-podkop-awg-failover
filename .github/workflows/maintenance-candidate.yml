name: Failover maintenance candidate
on:
  push:
    branches: [feature/home-net-vpn-maintenance]
  pull_request:
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sh tests/test-maintenance-candidate.sh
